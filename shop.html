<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniture Catalog | KASON IDEAL CREATION</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html { scroll-behavior: smooth; }
    /* Custom Scrollbar for Modal */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    /* Modal Animation */
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate { animation: modalFadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-[#FAF9F6] text-stone-800 font-sans min-h-screen flex flex-col justify-between selection:bg-amber-700 selection:text-white">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg shadow-sm border-b border-stone-200 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black tracking-widest text-stone-900 uppercase flex items-center gap-2">
        KASON <span class="text-amber-700 font-light">IDEAL</span>
      </a>
      <div class="space-x-4">
        <a href="index.html" class="group flex items-center text-sm font-semibold text-stone-500 hover:text-amber-700 transition duration-300">
          <i class="fa-solid fa-arrow-left-long mr-2 transform group-hover:-translate-x-1 transition duration-300"></i> Home
        </a>
      </div>
    </div>
  </nav>

  <!-- HERO HEADER -->
  <header class="relative bg-stone-900 text-white py-24 px-6 text-center bg-cover bg-center bg-no-repeat" style="background-image: url('https://images.unsplash.com/photo-1618220179428-22790b46a0eb?auto=format&fit=crop&q=80');">
    <div class="absolute inset-0 bg-gradient-to-b from-stone-900/80 to-stone-900/95"></div>
    <div class="relative z-10 max-w-2xl mx-auto flex flex-col items-center">
      <span class="text-amber-500 font-semibold tracking-widest uppercase text-sm mb-3">Our Collection</span>
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">Curated Excellence.</h1>
      <p class="text-stone-300 text-lg md:text-xl font-light leading-relaxed">Select any furniture piece to view details and place an order directly via our concierge on WhatsApp.</p>
    </div>
  </header>

  <!-- CATALOG CONTAINER -->
  <main class="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">

    <!-- CATEGORY FILTER BUTTONS -->
    <div class="flex flex-wrap justify-center gap-4 mb-16" id="filter-buttons">
      <button onclick="filterCategory('all')" class="filter-btn active bg-stone-900 text-white px-6 py-2.5 rounded-full font-medium text-sm tracking-wide shadow-md transition hover:bg-stone-800 hover:shadow-lg">All Pieces</button>
      <button onclick="filterCategory('living')" class="filter-btn bg-white border border-stone-200 text-stone-600 hover:text-stone-900 hover:border-stone-900 px-6 py-2.5 rounded-full font-medium text-sm tracking-wide transition">Living Room</button>
      <button onclick="filterCategory('bedroom')" class="filter-btn bg-white border border-stone-200 text-stone-600 hover:text-stone-900 hover:border-stone-900 px-6 py-2.5 rounded-full font-medium text-sm tracking-wide transition">Bedroom</button>
      <button onclick="filterCategory('dining')" class="filter-btn bg-white border border-stone-200 text-stone-600 hover:text-stone-900 hover:border-stone-900 px-6 py-2.5 rounded-full font-medium text-sm tracking-wide transition">Dining</button>
      <button onclick="filterCategory('office')" class="filter-btn bg-white border border-stone-200 text-stone-600 hover:text-stone-900 hover:border-stone-900 px-6 py-2.5 rounded-full font-medium text-sm tracking-wide transition">Office</button>
    </div>

    <!-- PRODUCTS GRID -->
    <div id="product-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-10">
      <!-- Dynamic products loaded by JavaScript -->
    </div>

  </main>

  <!-- ORDER MODAL -->
  <div id="order-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white rounded-2xl max-w-lg w-full p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto modal-animate border border-stone-100">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-stone-400 hover:text-stone-900 text-2xl transition bg-stone-100 hover:bg-stone-200 h-8 w-8 rounded-full flex items-center justify-center">&times;</button>
      
      <div id="modal-content" class="mb-6">
        <!-- Injected via JS -->
      </div>

      <!-- CUSTOMER ORDER DETAILS FORM -->
      <form id="whatsapp-form" onsubmit="sendWhatsAppOrder(event)" class="space-y-5 border-t border-stone-100 pt-6">
        <h4 class="font-bold text-stone-900 text-lg">Delivery Details</h4>
        
        <div>
          <label class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">Your Full Name</label>
          <input type="text" id="cust-name" required placeholder="John Doe" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-amber-700 focus:border-amber-700 focus:outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">Delivery Address</label>
          <input type="text" id="cust-address" required placeholder="123 Main Street, City" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-amber-700 focus:border-amber-700 focus:outline-none transition">
        </div>

        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">Quantity</label>
            <input type="number" id="cust-qty" value="1" min="1" onchange="updateTotal()" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-amber-700 focus:border-amber-700 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">Wood / Finish</label>
            <select id="cust-finish" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-amber-700 focus:border-amber-700 focus:outline-none transition appearance-none">
              <option value="Natural Teak">Natural Teak</option>
              <option value="Mahogany Stain">Mahogany Stain</option>
              <option value="Dark Walnut">Dark Walnut</option>
              <option value="Matte Black">Matte Black</option>
            </select>
          </div>
        </div>

        <div class="bg-stone-50 p-5 rounded-xl flex justify-between items-center border border-stone-200 mt-2">
          <span class="text-sm font-bold text-stone-500 uppercase tracking-wider">Total Price</span>
          <span id="calculated-total" class="text-2xl font-black text-amber-700">₦0</span>
        </div>

        <button type="submit" class="w-full bg-[#25D366] hover:bg-[#1ebe57] text-white font-bold py-4 rounded-xl shadow-lg shadow-[#25D366]/30 flex items-center justify-center gap-3 transition transform hover:-translate-y-0.5">
          <i class="fa-brands fa-whatsapp text-2xl"></i> Order via WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-stone-950 text-stone-400 py-12 border-t border-stone-900 mt-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="text-2xl font-black tracking-widest text-white uppercase flex items-center gap-2">
        KASON <span class="text-amber-700 font-light">IDEAL</span>
      </div>
      <p class="text-sm">&copy; 2026 Kason Ideal Creation. All rights reserved.</p>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    const PHONE_NUMBER = "2347037350870";

    const products = [
      { id: 1, name: "Luxury Velvet Sofa", category: "living", price: 350000, img: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&q=80", desc: "Premium 3-seater living room sofa crafted with high-density foam and plush velvet upholstery." },
      { id: 2, name: "Modern Oak Coffee Table", category: "living", price: 120000, img: "https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&q=80", desc: "Minimalist oak coffee table with tempered glass top and storage shelf." },
      { id: 3, name: "Royal King Bed Frame", category: "bedroom", price: 480000, img: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&q=80", desc: "Handcrafted king-size wooden bed frame with padded headboard." },
      { id: 4, name: "Minimalist Nightstand", category: "bedroom", price: 65000, img: "https://images.unsplash.com/photo-1532323544230-7191fd51bc1b?auto=format&fit=crop&q=80", desc: "Sleek bedroom bedside table with smooth drawer sliders and cable routing." },
      { id: 5, name: "6-Seater Dining Set", category: "dining", price: 520000, img: "https://images.unsplash.com/photo-1617806118233-18e1de247200?auto=format&fit=crop&q=80", desc: "Solid hardwood dining table complete with 6 ergonomic upholstered chairs." },
      { id: 6, name: "Executive Ergonomic Desk", category: "office", price: 280000, img: "https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&q=80", desc: "Spacious office desk featuring integrated wire channels and dual lockable drawers." }
    ];

    let currentProduct = null;

    function displayProducts(items) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = items.map(p => `
        <div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-2xl border border-stone-100 flex flex-col justify-between transition-all duration-500 transform hover:-translate-y-1">
          <div>
            <div class="h-72 overflow-hidden relative">
              <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover transform group-hover:scale-110 transition duration-700 ease-in-out">
              <span class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm text-stone-900 text-xs px-4 py-1.5 rounded-full uppercase font-bold tracking-wider shadow-sm">${p.category}</span>
            </div>
            <div class="p-8 pb-4">
              <h3 class="font-extrabold text-2xl text-stone-900">${p.name}</h3>
              <p class="text-stone-500 text-sm mt-3 line-clamp-2 leading-relaxed">${p.desc}</p>
            </div>
          </div>
          <div class="p-8 pt-4 flex flex-col xl:flex-row xl:justify-between xl:items-center gap-4 mt-2">
            <span class="text-2xl font-black text-amber-700">₦${p.price.toLocaleString()}</span>
            <button onclick="openModal(${p.id})" class="bg-stone-900 hover:bg-amber-700 text-white px-6 py-3 rounded-xl text-sm font-bold tracking-wide transition duration-300 w-full xl:w-auto text-center">
              Order Piece
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-stone-900', 'text-white', 'shadow-md');
        btn.classList.add('bg-white', 'text-stone-600');
      });
      event.target.classList.remove('bg-white', 'text-stone-600');
      event.target.classList.add('bg-stone-900', 'text-white', 'shadow-md');

      if (cat === 'all') {
        displayProducts(products);
      } else {
        displayProducts(products.filter(p => p.category === cat));
      }
    }

    function openModal(id) {
      currentProduct = products.find(p => p.id === id);
      document.getElementById('modal-content').innerHTML = `
        <div class="relative h-56 rounded-xl overflow-hidden mb-6 shadow-inner">
           <img src="${currentProduct.img}" class="w-full h-full object-cover">
        </div>
        <h3 class="text-3xl font-extrabold text-stone-900 mb-2">${currentProduct.name}</h3>
        <p class="text-stone-500 text-sm leading-relaxed mb-4">${currentProduct.desc}</p>
        <div class="text-sm font-bold text-stone-400 uppercase tracking-wider">Unit Price: <span class="text-amber-700 text-xl">₦${currentProduct.price.toLocaleString()}</span></div>
      `;
      document.getElementById('cust-qty').value = 1;
      updateTotal();
      document.getElementById('order-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal() {
      document.getElementById('order-modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function updateTotal() {
      const qty = parseInt(document.getElementById('cust-qty').value) || 1;
      const total = currentProduct.price * qty;
      document.getElementById('calculated-total').innerText = '₦' + total.toLocaleString();
    }

    function sendWhatsAppOrder(e) {
      e.preventDefault();
      
      const name = document.getElementById('cust-name').value;
      const address = document.getElementById('cust-address').value;
      const qty = document.getElementById('cust-qty').value;
      const finish = document.getElementById('cust-finish').value;
      const total = (currentProduct.price * qty).toLocaleString();

      const message = `Hello *KASON IDEAL CREATION*, I would like to place an order:%0A%0A` +
        `🛋️ *Product:* ${currentProduct.name}%0A` +
        `🎨 *Finish/Color:* ${finish}%0A` +
        `📦 *Quantity:* ${qty}%0A` +
        `💰 *Total Price:* ₦${total}%0A%0A` +
        `👤 *Customer Name:* ${name}%0A` +
        `📍 *Delivery Address:* ${address}%0A%0A` +
        `Please confirm availability and payment details.`;

      const whatsappURL = `https://wa.me/${PHONE_NUMBER}?text=${message}`;
      window.open(whatsappURL, '_blank');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const catParam = urlParams.get('category');
    if (catParam) {
      // Find button and trigger click to maintain styling
      const btn = Array.from(document.querySelectorAll('.filter-btn')).find(b => b.textContent.toLowerCase().includes(catParam.toLowerCase()));
      if(btn) {
         btn.click();
      } else {
         filterCategory(catParam);
      }
    } else {
      displayProducts(products);
    }
  </script>
</body>
</html>
